<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; }
        :root {
            --bg: #f0f2f5; --surface: #fff; --surface2: #f8fafc;
            --border: #e2e8f0; --border2: #d1d5db;
            --text: #1e293b; --text2: #475569; --text3: #64748b; --text4: #94a3b8;
            --accent: #3b82f6; --accent-hover: #2563eb;
            --bubble-user: #3b82f6; --bubble-user-text: #fff;
            --bubble-ai: #fff; --bubble-ai-border: #e2e8f0;
            --code-bg: #f1f5f9; --pre-bg: #1e1e24; --pre-text: #abb2bf;
            --thinking-bg: #f8fafc; --thinking-border: #94a3b8; --thinking-text: #64748b;
            --shadow: rgba(0,0,0,0.08);
            --sidebar-width: 280px;
        }
        .dark {
            --bg: #0f172a; --surface: #1e293b; --surface2: #1a2332;
            --border: #334155; --border2: #475569;
            --text: #f1f5f9; --text2: #cbd5e1; --text3: #94a3b8; --text4: #64748b;
            --accent: #6366f1; --accent-hover: #818cf8;
            --bubble-user: #6366f1; --bubble-user-text: #fff;
            --bubble-ai: #1e293b; --bubble-ai-border: #334155;
            --code-bg: #334155; --pre-bg: #0f172a; --pre-text: #e2e8f0;
            --thinking-bg: #1a2332; --thinking-border: #475569; --thinking-text: #94a3b8;
            --shadow: rgba(0,0,0,0.3);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
        }
        .app { display: flex; height: 100vh; }

        .sidebar {
            width: var(--sidebar-width); background: var(--surface);
            border-right: 1px solid var(--border); display: flex;
            flex-direction: column; flex-shrink: 0; overflow: hidden;
        }
        .sidebar-header {
            padding: 12px; border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 8px;
        }
        .sidebar-header .top-row {
            display: flex; align-items: center; justify-content: space-between;
        }
        .sidebar-header h1 { font-size: 1rem; font-weight: 600; }
        .sidebar-header .model-select {
            width: 100%; padding: 6px 10px; border: 1px solid var(--border2);
            border-radius: 8px; font-size: 0.82rem; background: var(--surface);
            color: var(--text); outline: none; cursor: pointer;
        }
        .sidebar-search {
            padding: 8px 12px; border-bottom: 1px solid var(--border);
        }
        .sidebar-search input {
            width: 100%; padding: 6px 10px; border: 1px solid var(--border2);
            border-radius: 8px; font-size: 0.82rem; outline: none;
            background: var(--surface); color: var(--text);
        }
        .sidebar-search input:focus { border-color: var(--accent); }

        .conv-list {
            flex: 1; overflow-y: auto; padding: 4px 0;
        }
        .conv-item {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 12px; cursor: pointer; border-radius: 0;
            margin: 0 4px; border-radius: 8px; position: relative;
        }
        .conv-item:hover { background: var(--surface2); }
        .conv-item.active { background: var(--surface2); }
        .conv-item .conv-name {
            flex: 1; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; font-size: 0.85rem; color: var(--text);
        }
        .conv-item .conv-meta {
            font-size: 0.65rem; color: var(--text4); white-space: nowrap;
        }
        .conv-item .conv-actions {
            display: none; gap: 2px; flex-shrink: 0;
        }
        .conv-item:hover .conv-actions { display: flex; }
        .conv-item .conv-actions button {
            background: none; border: none; cursor: pointer;
            color: var(--text4); font-size: 0.75rem; padding: 2px 4px;
            border-radius: 4px;
        }
        .conv-item .conv-actions button:hover { color: var(--text); background: var(--border); }

        .sidebar-footer {
            padding: 8px 12px; border-top: 1px solid var(--border);
        }
        .sidebar-footer button {
            width: 100%; padding: 8px; border: 1px solid var(--border2);
            border-radius: 8px; background: var(--surface); color: var(--text2);
            cursor: pointer; font-size: 0.82rem;
        }
        .sidebar-footer button:hover { background: var(--surface2); }

        .main {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
        }
        header {
            padding: 8px 16px; background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        header .hdr-title { font-size: 0.9rem; font-weight: 600; margin-right: auto; }
        .hdr-btn {
            background: none; border: 1px solid var(--border2); border-radius: 8px;
            padding: 4px 10px; font-size: 0.75rem; cursor: pointer; color: var(--text2);
            white-space: nowrap;
        }
        .hdr-btn:hover { background: var(--surface2); }
        .hdr-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #statBar {
            padding: 4px 16px; background: var(--surface2);
            border-bottom: 1px solid var(--border);
            font-size: 0.72rem; color: var(--text3);
            display: flex; gap: 16px; flex-shrink: 0; flex-wrap: wrap;
        }

        #messages {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
        }
        .msg { display: flex; gap: 10px; max-width: 88%; flex-wrap: wrap; position: relative; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.ai { align-self: flex-start; }
        .msg .msg-actions {
            position: absolute; top: 100%; right: 0; visibility: hidden;
            display: flex; gap: 2px; z-index: 1;
        }
        .msg.ai .msg-actions { left: 0; right: auto; }
        .msg:hover .msg-actions { visibility: visible; }
        .msg .msg-actions button {
            background: var(--surface); border: 1px solid var(--border2);
            border-radius: 6px; padding: 2px 6px; font-size: 0.65rem;
            cursor: pointer; color: var(--text3); white-space: nowrap;
        }
        .msg .msg-actions button:hover { background: var(--surface2); }

        .bubble {
            padding: 10px 14px; border-radius: 16px; font-size: 0.92rem;
            line-height: 1.6; white-space: pre-wrap; word-break: break-word;
            min-width: 40px;
        }
        .msg.user .bubble { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 4px; }
        .msg.ai .bubble { background: var(--bubble-ai); border: 1px solid var(--bubble-ai-border); border-bottom-left-radius: 4px; }

        .msg.ai .bubble p { margin-bottom: 6px; }
        .msg.ai .bubble p:last-child { margin-bottom: 0; }
        .msg.ai .bubble code {
            background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
            font-size: 0.85em; font-family: 'SF Mono', Consolas, monospace;
        }
        .msg.ai .bubble pre {
            background: var(--pre-bg); color: var(--pre-text); padding: 10px 14px;
            border-radius: 10px; overflow-x: auto; margin: 6px 0;
            font-size: 0.82rem; font-family: 'SF Mono', Consolas, monospace;
            white-space: pre-wrap; word-break: break-word; position: relative;
        }
        .msg.ai .bubble pre code { background: transparent; padding: 0; }
        .msg.ai .bubble pre .copy-code-btn {
            position: absolute; top: 6px; right: 6px;
            background: var(--surface); border: 1px solid var(--border2);
            border-radius: 6px; padding: 2px 8px; font-size: 0.65rem;
            cursor: pointer; color: var(--text3); opacity: 0;
            transition: opacity 0.15s;
        }
        .msg.ai .bubble pre:hover .copy-code-btn { opacity: 1; }

        .thinking {
            padding: 8px 12px; background: var(--thinking-bg);
            border-left: 3px solid var(--thinking-border); border-radius: 8px;
            font-size: 0.82rem; color: var(--thinking-text); margin-bottom: 6px;
            cursor: pointer; position: relative;
        }
        .thinking .thinking-toggle {
            float: right; font-size: 0.7rem; color: var(--text4);
            user-select: none;
        }
        .thinking .thinking-content {
            display: block; margin-top: 4px;
        }
        .thinking.collapsed .thinking-content { display: none; }

        .msg.editing .bubble { padding: 4px; }
        .msg.editing textarea {
            width: 100%; border: 2px solid var(--accent); border-radius: 12px;
            padding: 8px 10px; font-size: 0.9rem; font-family: inherit;
            resize: vertical; outline: none; min-height: 60px;
        }

        .input-area {
            padding: 12px 16px; background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
        }
        #input {
            flex: 1; padding: 10px 14px; border: 1px solid var(--border2);
            border-radius: 24px; outline: none; font-size: 0.92rem;
            resize: none; max-height: 120px; font-family: inherit;
            line-height: 1.5; scrollbar-width: none; background: var(--surface);
            color: var(--text);
        }
        #input::-webkit-scrollbar { display: none; }
        #input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
        #sendBtn {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: var(--accent); color: #fff; cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s; flex-shrink: 0;
        }
        #sendBtn:hover { background: var(--accent-hover); }
        #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

        .typing .bubble { position: relative; }
        .typing .bubble::after {
            content: '';
            display: inline-block;
            animation: dots 1.5s steps(4,end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); align-items: center;
            justify-content: center; z-index: 9999; padding: 16px;
        }
        .modal.show { display: flex; }
        .modal-panel {
            background: var(--surface); border-radius: 20px; padding: 24px;
            width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 20px 40px var(--shadow);
        }
        .modal-panel h2 { font-size: 1.1rem; margin-bottom: 16px; }
        .modal-panel label {
            font-size: 0.82rem; font-weight: 600; display: block;
            margin-bottom: 3px; color: var(--text2);
        }
        .modal-panel input, .modal-panel select, .modal-panel textarea {
            width: 100%; padding: 8px 10px; border: 1px solid var(--border2);
            border-radius: 10px; font-size: 0.88rem; margin-bottom: 10px;
            outline: none; font-family: inherit; background: var(--surface);
            color: var(--text);
        }
        .modal-panel input:focus, .modal-panel select:focus, .modal-panel textarea:focus { border-color: var(--accent); }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
        .modal-actions button {
            padding: 8px 18px; border-radius: 40px; border: none; font-weight: 500;
            cursor: pointer; font-size: 0.85rem;
        }
        .modal-actions .primary { background: var(--accent); color: #fff; }
        .modal-actions .primary:hover { background: var(--accent-hover); }
        .modal-actions .secondary { background: var(--border); color: var(--text2); }
        .modal-actions .secondary:hover { background: var(--border2); }
        .modal-actions .danger { background: #fee2e2; color: #dc2626; }

        .empty-state {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: var(--text4); font-size: 0.9rem; text-align: center;
            line-height: 2; flex-direction: column; gap: 4px;
        }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--bg); padding: 8px 18px;
            border-radius: 40px; font-size: 0.82rem; z-index: 99999;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }

        .params-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .params-grid .full { grid-column: 1 / -1; }
        .param-tab {
            background: none; border: none; padding: 8px 14px; font-size: 0.82rem;
            cursor: pointer; color: var(--text3); border-bottom: 2px solid transparent;
            margin-bottom: -2px; font-weight: 500;
        }
        .param-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .param-row {
            display: flex; align-items: center; gap: 6px; padding: 4px 0;
        }
        .param-row .p-chk { width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; }
        .param-row .p-key {
            font-size: 0.82rem; font-weight: 600; color: var(--text2);
            min-width: 120px; font-family: 'SF Mono', Consolas, monospace;
        }
        .param-row .p-key.locked { color: var(--text3); }
        .param-row .p-val { flex: 1; }
        .param-row .p-val input, .param-row .p-val select {
            width: 100%; padding: 6px 8px; border: 1px solid var(--border2);
            border-radius: 8px; font-size: 0.82rem; outline: none; font-family: inherit;
            background: var(--surface); color: var(--text);
        }
        .param-row .p-val input:focus { border-color: var(--accent); }
        .param-row .p-del {
            background: none; border: none; cursor: pointer; color: var(--text4);
            font-size: 1rem; padding: 2px 4px; flex-shrink: 0;
        }
        .param-row .p-del:hover { color: #dc2626; }
        .conv-list-empty {
            text-align: center; padding: 20px; color: var(--text4); font-size: 0.82rem;
        }
        #sidebarToggle {
            display: none; background: none; border: none; font-size: 1.2rem;
            cursor: pointer; color: var(--text2); padding: 4px;
        }

        @media (max-width: 700px) {
            .sidebar {
                position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
                transform: translateX(-100%); transition: transform 0.2s;
            }
            .sidebar.open { transform: translateX(0); }
            #sidebarToggle { display: block; }
            .msg { max-width: 95%; }
            .modal-panel { padding: 16px; }
            .params-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="top-row">
                <h1>AI Chat</h1>
                <button class="hdr-btn" onclick="toggleTheme()" title="切换主题" style="padding:2px 8px;font-size:0.9rem;">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
            <select class="model-select" id="modelSelect" onchange="onModelChange(this.value)"></select>
        </div>
        <div class="sidebar-search">
            <input type="search" id="convSearch" placeholder="搜索对话..." oninput="filterConvs(this.value)">
        </div>
        <div class="conv-list" id="convList"></div>
        <div class="sidebar-footer">
            <button onclick="newChat()">+ 新对话</button>
        </div>
    </div>

    <div class="main">
        <header>
            <button id="sidebarToggle" onclick="toggleSidebar()">☰</button>
            <span class="hdr-title" id="hdrTitle">AI Chat</span>
            <button class="hdr-btn" onclick="copyMessages()">📋 复制全部</button>
            <button class="hdr-btn" onclick="showParams()">⚙️ 参数</button>
            <button class="hdr-btn" onclick="showConfig()">🔑 设置</button>
        </header>
        <div id="statBar">
            <span id="statMsgs">消息: 0</span>
            <span id="statChars">字符: 0</span>
            <span id="statTokens">预估 Token: 0</span>
        </div>
        <div id="messages">
            <div class="empty-state">
                👋 你好！开始聊天吧<br>
                <span style="font-size:0.82rem;color:var(--text4);">左侧选择或创建对话</span>
            </div>
        </div>
        <div class="input-area">
            <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="onKey(event)"></textarea>
            <button id="sendBtn" onclick="send()">➤</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="configModal">
    <div class="modal-panel">
        <h2>🔑 设置</h2>
        <label>API 地址</label>
        <input id="cfgUrl" placeholder="https://api.deepseek.com/v1/chat/completions">
        <div class="hint" style="font-size:0.78rem;color:var(--text3);margin:-6px 0 10px 2px;">
            可使用 ech-proxy 的 <code style="background:var(--code-bg);padding:1px 5px;border-radius:4px;font-family:monospace;">zen.l.moonchan.xyz</code> 作为默认后端转发
        </div>
        <label>API Key</label>
        <input id="cfgKey" type="password" placeholder="sk-...">
        <label>模型</label>
        <input id="cfgModel" list="modelList" placeholder="deepseek-v4-flash-free">
        <datalist id="modelList">
            <option value="deepseek-v4-flash-free">
            <option value="deepseek-chat">
            <option value="gpt-4o">
            <option value="claude-sonnet-4-20250514">
        </datalist>
        <label>System Prompt</label>
        <textarea id="cfgSystem" rows="3" placeholder="可选，AI 角色设定" style="resize:vertical;"></textarea>
        <div class="modal-actions">
            <button class="primary" onclick="saveConfig()">保存</button>
            <button class="secondary" onclick="hideModal('configModal')">取消</button>
        </div>
    </div>
</div>

<div class="modal" id="paramsModal">
    <div class="modal-panel">
        <h2>⚙️ 请求参数</h2>
        <div style="display:flex;gap:4px;margin-bottom:12px;border-bottom:2px solid var(--border);">
            <button class="param-tab active" data-mode="table" onclick="switchParamMode('table')">📋 表格</button>
            <button class="param-tab" data-mode="json" onclick="switchParamMode('json')">📝 JSON</button>
        </div>
        <div id="paramsTableView"><div id="paramRows"></div></div>
        <div id="paramsJsonView" style="display:none;">
            <textarea id="pJson" rows="8" style="width:100%;font-family:monospace;font-size:0.82rem;border:1px solid var(--border2);border-radius:10px;padding:8px 10px;outline:none;resize:vertical;box-sizing:border-box;background:var(--surface);color:var(--text);"></textarea>
        </div>
        <div class="modal-actions">
            <button class="primary" onclick="saveParams()">保存</button>
            <button class="secondary" onclick="resetParams()">重置</button>
            <button class="secondary" onclick="hideModal('paramsModal')">取消</button>
        </div>
    </div>
</div>

<div class="modal" id="renameModal">
    <div class="modal-panel">
        <h2>✏️ 重命名对话</h2>
        <input id="renameInput" placeholder="输入新名称">
        <div class="modal-actions">
            <button class="primary" onclick="doRename()">保存</button>
            <button class="secondary" onclick="hideModal('renameModal')">取消</button>
        </div>
    </div>
</div>

<script src="state.js"></script>
<script src="utils.js"></script>
<script src="storage.js"></script>
<script src="messages.js"></script>
<script src="config-ui.js"></script>
<script src="conv.js"></script>
<script src="api.js"></script>
<script src="index.js"></script>
</body>
</html>
