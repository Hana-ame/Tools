<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剪贴板 IP 检测器</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --primary: #4A90E2;
            --primary-hover: #357ABD;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1e1e2e;
                --text-color: #cdd6f4;
                --card-bg: #313244;
                --primary: #89b4fa;
                --primary-hover: #b4befe;
                --shadow: 0 4px 6px rgba(0,0,0,0.3);
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.8;
            font-size: 1.1em;
        }

        .btn {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: var(--shadow);
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* 卡片网格布局 */
        #cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 卡片样式 */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeIn 0.5s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(128,128,128,0.2);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.4em;
            color: var(--primary);
            word-break: break-all;
        }

        .ip-type {
            font-size: 0.8em;
            background: rgba(128,128,128,0.2);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .info-row {
            margin: 8px 0;
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.85em;
            opacity: 0.7;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 1.05em;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            opacity: 0.5;
            font-style: italic;
        }

        /* 状态提示语 */
        #status-msg {
            text-align: center;
            height: 24px;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔍 剪贴板 IP 检测器</h1>
        <p>在当前页面按下 <b>Ctrl + V</b>，或点击下方按钮，自动提取并查询剪贴板中的 IPv4 / IPv6。</p>
        <button class="btn" onclick="readClipboardBtn()">读取系统剪贴板</button>
    </div>

    <div id="status-msg">等待检测...</div>

    <div id="cards-container"></div>

    <script>
        // IPv4 和 IPv6 的正则表达式
        const ipv4Regex = /\b(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)\b/g;
        // 匹配标准和压缩格式的IPv6
        const ipv6Regex = /(?:(?:[a-fA-F\d]{1,4}:){7}(?:[a-fA-F\d]{1,4}|:)|(?:[a-fA-F\d]{1,4}:){6}(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)){3}|:[a-fA-F\d]{1,4}|:)|(?:[a-fA-F\d]{1,4}:){5}(?::(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)){3}|(?::[a-fA-F\d]{1,4}){1,2}|:)|(?:[a-fA-F\d]{1,4}:){4}(?:(?::[a-fA-F\d]{1,4}){0,1}:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)){3}|(?::[a-fA-F\d]{1,4}){1,3}|:)|(?:[a-fA-F\d]{1,4}:){3}(?:(?::[a-fA-F\d]{1,4}){0,2}:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)){3}|(?::[a-fA-F\d]{1,4}){1,4}|:)|(?:[a-fA-F\d]{1,4}:){2}(?:(?::[a-fA-F\d]{1,4}){0,3}:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)){3}|(?::[a-fA-F\d]{1,4}){1,5}|:)|(?:[a-fA-F\d]{1,4}:){1}(?:(?::[a-fA-F\d]{1,4}){0,4}:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)){3}|(?::[a-fA-F\d]{1,4}){1,6}|:)|(?::(?:(?::[a-fA-F\d]{1,4}){0,5}:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]\d|\d)){3}|(?::[a-fA-F\d]{1,4}){1,7}|:)))(?:%[0-9a-zA-Z]{1,})?/g;

        // 记录已查询过的IP，防止重复请求
        const queriedIPs = new Set();
        const container = document.getElementById('cards-container');
        const statusMsg = document.getElementById('status-msg');

        function showStatus(msg) {
            statusMsg.textContent = msg;
            setTimeout(() => {
                if (statusMsg.textContent === msg) statusMsg.textContent = '等待检测...';
            }, 3000);
        }

        // 处理提取到的文本
        function processText(text) {
            if (!text) return;
            
            const v4Matches = text.match(ipv4Regex) || [];
            const v6Matches = text.match(ipv6Regex) || [];
            
            // 合并去重当前文本中的 IP
            const allIPs = [...new Set([...v4Matches, ...v6Matches])];

            if (allIPs.length === 0) {
                showStatus('剪贴板中未检测到 IP 地址');
                return;
            }

            let newIpCount = 0;
            allIPs.forEach(ip => {
                if (!queriedIPs.has(ip)) {
                    queriedIPs.add(ip);
                    newIpCount++;
                    // 判断类型，如果是纯数字和点则是v4
                    const type = ip.includes(':') ? 'IPv6' : 'IPv4';
                    createLoadingCard(ip, type);
                    fetchIPInfo(ip);
                }
            });

            if (newIpCount > 0) {
                showStatus(`已检测并开始查询 ${newIpCount} 个新 IP`);
            } else {
                showStatus('剪贴板中的 IP 均已查询过');
            }
        }

        // 监听全局粘贴事件 (Ctrl+V)
        document.addEventListener('paste', (event) => {
            const text = (event.clipboardData || window.clipboardData).getData('text');
            processText(text);
        });

        // 点击按钮主动读取剪贴板
        async function readClipboardBtn() {
            try {
                const text = await navigator.clipboard.readText();
                processText(text);
            } catch (err) {
                showStatus('读取剪贴板失败，请允许权限或使用 Ctrl+V 粘贴');
                console.error('Failed to read clipboard: ', err);
            }
        }

        // 创建加载中的骨架卡片
        function createLoadingCard(ip, type) {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${ip.replace(/[:.]/g, '-')}`; // 安全的 DOM ID
            
            card.innerHTML = `
                <div class="card-header">
                    <h2>${ip}</h2>
                    <span class="ip-type">${type}</span>
                </div>
                <div class="loading">正在查询 ipinfo.io...</div>
            `;
            // 插在最前面
            container.insertBefore(card, container.firstChild);
        }

        // 调用 ipinfo.io 接口
        async function fetchIPInfo(ip) {
            try {
                // 使用 /json 端点获取数据
                const response = await fetch(`https://ipinfo.io/${ip}/json`);
                if (!response.ok) throw new Error('API Request Failed');
                const data = await response.json();
                updateCard(ip, data);
            } catch (error) {
                updateCardError(ip);
                console.error(`Error fetching data for ${ip}:`, error);
            }
        }

        // 更新卡片内容
        function updateCard(ip, data) {
            const cardId = `card-${ip.replace(/[:.]/g, '-')}`;
            const card = document.getElementById(cardId);
            if (!card) return;

            const safeRender = (val) => val ? val : '<span style="opacity:0.5">N/A</span>';
            const locationStr = [data.city, data.region, data.country].filter(Boolean).join(', ');

            card.innerHTML = `
                <div class="card-header">
                    <h2>${ip}</h2>
                    <span class="ip-type">${ip.includes(':') ? 'IPv6' : 'IPv4'}</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">位置 (Location)</span>
                    <span class="info-value">${safeRender(locationStr)}</span>
                </div>

                <div class="info-row">
                    <span class="info-label">运营商 / 组织 (Org / ISP)</span>
                    <span class="info-value">${safeRender(data.org)}</span>
                </div>

                <div class="info-row">
                    <span class="info-label">主机名 (Hostname)</span>
                    <span class="info-value">${safeRender(data.hostname)}</span>
                </div>

                <div class="info-row">
                    <span class="info-label">经纬度 (Coordinates)</span>
                    <span class="info-value">${safeRender(data.loc)}</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">时区 (Timezone)</span>
                    <span class="info-value">${safeRender(data.timezone)}</span>
                </div>
            `;
        }

        // 查询失败时的展示
        function updateCardError(ip) {
            const cardId = `card-${ip.replace(/[:.]/g, '-')}`;
            const card = document.getElementById(cardId);
            if (!card) return;

            card.innerHTML = `
                <div class="card-header">
                    <h2>${ip}</h2>
                    <span class="ip-type">${ip.includes(':') ? 'IPv6' : 'IPv4'}</span>
                </div>
                <div class="loading" style="color: #e74c3c;">查询失败，请检查网络或是否触发 API 限制。</div>
            `;
        }
    </script>
</body>
</html>
